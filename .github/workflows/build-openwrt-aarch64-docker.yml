name: build-QEMU-armsr-armv8

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: true
        default: "25.12"
        type: choice
        options:
          - 25.12
          - 25.12-SNAPSHOT

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: openwrt

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:  
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@main

      - name: Building armsr-armv8 QEMU ImmortalWrt
        run: |
          luci_version="${{ github.event.inputs.luci_version }}"
          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/DIY/aarch64/uci-defaults/settings-aarch64:/home/build/immortalwrt/files/etc/uci-defaults/settings-aarch64" \
            -v "${{ github.workspace }}/DIY/aarch64/.config:/home/build/immortalwrt/.config" \
            -v "${{ github.workspace }}/DIY/aarch64/build.sh:/home/build/immortalwrt/build.sh" \
            immortalwrt/imagebuilder:armsr-armv8-openwrt-${luci_version} /bin/bash /home/build/immortalwrt/build.sh
          cp ${{ github.workspace }}/bin/targets/armsr/armv8/*.tar ${{ github.workspace }}

#      - name: Firmware
#        run: |
#          cd ${{ github.workspace }}/bin/targets/armsr/armv8/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver-opts: network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ${{ github.workspace }}/DIY/aarch64/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}:latest
          platforms: linux/arm64
