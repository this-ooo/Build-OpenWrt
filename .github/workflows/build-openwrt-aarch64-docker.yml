name: build-QEMU-armsr-armv8-24.10.x

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: true
        default: "25.12"
        type: choice
        options:
          - 25.12
          - 25.12-SNAPSHOT

permissions:
  contents: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: openwrt

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/armsr-armv8/build.sh

      - name: Building armsr-armv8 QEMU ImmortalWrt 24.10.x
        run: |
          luci_version="${{ github.event.inputs.luci_version }}"
          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/DIY/aarch64/uci-defaults/settings-aarch64:/home/build/immortalwrt/files/etc/uci-defaults/settings-aarch64" \
            -v "${{ github.workspace }}/DIY/aarch64/.config:/home/build/immortalwrt/.config" \
            -v "${{ github.workspace }}/DIY/aarch64/build.sh:/home/build/immortalwrt/build.sh" \
            immortalwrt/imagebuilder:armsr-armv8-openwrt-${luci_version} /bin/bash /home/build/immortalwrt/build.sh

      - name: Copy Firmware to workspace
        run: |
          cd ${{ github.workspace }}/bin/targets/armsr/armv8/
          TMPDIR=openwrt_rootfs
          #[ -d "$TMPDIR" ] && rm -rf "$TMPDIR"
          mkdir -p "$TMPDIR"
          gzip -dc *-rootfs.tar.gz | ( cd "$TMPDIR" && tar xf - )
          (cd "$TMPDIR" && tar cf ../openwrt-rootfs-patched.tar .)
          #cp ${{ github.workspace }}/bin/targets/armsr/armv8/*.tar ${{ github.workspace }}
          
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context:
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
